name: Decoder checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[notebook]"
      - run: python -m unittest discover -s tests -v
      - run: python demo.py
      - name: Validate and execute notebook in a fresh kernel
        env:
          MPLBACKEND: Agg
        run: |
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read('Fibonacci_Decoder.ipynb', as_version=4)
          nbformat.validate(nb)
          NotebookClient(nb, timeout=600, kernel_name='python3').execute()
          nbformat.write(nb, 'Fibonacci_Decoder-executed.ipynb')
        shell: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-notebook-py${{ matrix.python-version }}
          path: Fibonacci_Decoder-executed.ipynb
